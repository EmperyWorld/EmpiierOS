[package]
name = "seat_shield_probe"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "EmpiierOS Seat Shield inet_diag dump helper (no eBPF, no AF_PACKET)."
license = "MIT"
publish = false

[[bin]]
name = "seat-shield-probe"
path = "src/main.rs"

[dependencies]
libc = "0.2"

[profile.release]
panic = "abort"
lto = false
strip = "debuginfo"
