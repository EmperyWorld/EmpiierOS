[package]
name = "seat_browser_core"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "EmpiierOS Seat Browser — pure nav-policy logic (prep bay)."
license = "MIT"
publish = false

[lib]
name = "seat_browser_core"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "allow", priority = -1 }
