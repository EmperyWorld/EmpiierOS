[package]
name = "seat_shield_core"
version = "0.8.0"
edition = "2021"
rust-version = "1.75"
description = "EmpiierOS Seat Shield — prep-bay Runtime-shaped module (production-grade logic)."
license = "MIT"
publish = false

[lib]
name = "seat_shield_core"
path = "src/lib.rs"

[[bin]]
name = "seat-shield-harness"
path = "src/bin/seat_shield_harness.rs"

[[bin]]
name = "seat-shield-fw"
path = "src/bin/seat_shield_fw.rs"

[[bin]]
name = "seat-shield-watch"
path = "src/bin/seat_shield_watch.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
inotify = "0.10"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "allow", priority = -1 }

[profile.release]
panic = "abort"
lto = false
strip = "debuginfo"
