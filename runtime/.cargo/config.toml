# Loaded when cargo's cwd is runtime/. Repo-root `.cargo/config.toml` is SoT
# for packager builds from EmpiierOS/. Keep these flags identical.

[target.x86_64-unknown-linux-gnu]
rustflags = [
  "-C", "relocation-model=pic",
  "-C", "link-arg=-Wl,-z,relro,-z,now",
  "-C", "link-arg=-Wl,-z,noexecstack",
]
